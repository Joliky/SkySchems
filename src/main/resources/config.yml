  schem-pasted: "&aСхема &e{schem}&a вставлена. Блоков: &e{blocks}&a."
  schem-cleared: "&aPreview схемы очищен."
  schem-no-preview: "&cСначала сделай preview: &e/ss preview <name>&c."
  schem-wrong-world: "&cPreview был создан в другом мире. Сделай preview заново."
